<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: rispetta notch e home indicator di iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Aspettando Natale</title>

  <!-- Anteprima link WhatsApp: misteriosa, nessuno spoiler -->
  <meta name="description" content="Hai una sorpresa in attesa…">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hai una sorpresa in attesa… 🎄">
  <meta property="og:description" content="Non ancora. Ma manca pochissimo.">
  <meta property="og:locale" content="it_IT">
  <!-- Facoltativo: immagine anteprima (URL ASSOLUTO, ~1200x630). Vedi README.
  <meta property="og:image" content="https://TUO-DOMINIO/og.jpg"> -->
  <meta name="theme-color" content="#0d1a14">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l10 22H6z' fill='%232f8f55'/%3E%3Crect x='14' y='24' width='4' height='5' fill='%238a5a3a'/%3E%3Ccircle cx='16' cy='5' r='2.5' fill='%23f2c27b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Luci di Natale in alto (solo decorazione, riempite da JS) -->
  <div id="lights" class="lights" aria-hidden="true"></div>

  <main class="stage">

    <!-- ============ CONTO ALLA ROVESCIA ============ -->
    <section id="locked" class="panel card" aria-labelledby="lockedTitle">
      <svg class="tree" viewBox="0 0 64 72" width="84" height="94" aria-hidden="true">
        <path d="M32 10 49 34H40l13 20H11l13-20h-9z" fill="#2f8f55"/>
        <path d="M32 10 49 34H40l13 20H32z" fill="#237a47"/>
        <rect x="28" y="54" width="8" height="10" rx="1.5" fill="#8a5a3a"/>
        <path d="M32 1l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.6-4.5 2.6 1-5-3.7-3.4 5-.6z" fill="#ffd978"/>
        <circle cx="26" cy="36" r="2.2" fill="#ff5a5f"/><circle cx="38" cy="44" r="2.2" fill="#ffd978"/>
        <circle cx="24" cy="50" r="2.2" fill="#ffd978"/><circle cx="35" cy="28" r="2" fill="#ff5a5f"/>
      </svg>

      <h1 id="lockedTitle" class="title"></h1>
      <p id="lockedSubtitle" class="message"></p>

      <!-- role=timer + aria-live=off: aggiorna ogni secondo senza far parlare lo screen reader di continuo -->
      <div id="countdown" class="countdown" role="timer" aria-live="off">
        <div class="unit"><span class="num" id="cd-days">--</span><span class="lbl">Giorni</span></div>
        <div class="unit"><span class="num" id="cd-hours">--</span><span class="lbl">Ore</span></div>
        <div class="unit"><span class="num" id="cd-minutes">--</span><span class="lbl">Minuti</span></div>
        <div class="unit"><span class="num" id="cd-seconds">--</span><span class="lbl">Secondi</span></div>
      </div>

      <div class="progress" aria-hidden="true"><div id="progressBar" class="bar"></div></div>
      <p id="unlockLabel" class="hint"></p>
    </section>

    <!-- ============ NATALE! ============ -->
    <section id="unlocked" class="panel card" aria-labelledby="unlockedTitle" hidden>
      <svg class="tree lit" viewBox="0 0 64 72" width="84" height="94" aria-hidden="true">
        <path d="M32 10 49 34H40l13 20H11l13-20h-9z" fill="#2f8f55"/>
        <path d="M32 10 49 34H40l13 20H32z" fill="#237a47"/>
        <rect x="28" y="54" width="8" height="10" rx="1.5" fill="#8a5a3a"/>
        <path d="M32 1l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.6-4.5 2.6 1-5-3.7-3.4 5-.6z" fill="#ffd978"/>
        <circle cx="26" cy="36" r="2.2" fill="#ff5a5f"/><circle cx="38" cy="44" r="2.2" fill="#ffd978"/>
        <circle cx="24" cy="50" r="2.2" fill="#ffd978"/><circle cx="35" cy="28" r="2" fill="#ff5a5f"/>
      </svg>
      <h2 id="unlockedTitle" class="title"></h2>
      <p id="unlockedMessage" class="message"></p>
      <!-- href impostati da JS solo allo sblocco: il PDF non esiste prima -->
      <a id="pdfDownload" class="btn" target="_blank" rel="noopener"></a>
      <a id="pdfView" class="link" target="_blank" rel="noopener"></a>
    </section>

  </main>

  <noscript><p class="noscript">Per vedere il conto alla rovescia serve JavaScript attivo.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
